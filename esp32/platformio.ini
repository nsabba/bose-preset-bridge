; bose-preset-bridge - portage ESP32 (ELEGOO ESP-WROOM-32, 4 Mo de flash)
;
; Deux firmwares dans le même projet :
;   pio run -e power_test -t upload    jalon 0 : test d'alimentation par le port USB de la Bose
;   pio run -e bridge -t upload        jalons 1 à 4 : le bridge complet
;
; Le Wi-Fi configuré avec l'un est conservé par l'autre (il est stocké dans la NVS du Wi-Fi,
; qui survit au flashage tant qu'on ne fait pas « erase flash »).

[platformio]
default_envs = bridge

[env]
platform = espressif32 @ 6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600
; 2 partitions applicatives de 1,9 Mo (mise à jour OTA) et pas de système de fichiers :
; la page web est embarquée compressée dans le firmware.
board_build.partitions = min_spiffs.csv
build_flags =
  -DCORE_DEBUG_LEVEL=1
lib_deps =
  tzapu/WiFiManager @ 2.0.17

[env:power_test]
build_src_filter = -<*> +<power_test/>

[env:bridge]
build_src_filter = -<*> +<bridge/>
extra_scripts = pre:scripts/embed_page.py
lib_deps =
  ${env.lib_deps}
  links2004/WebSockets @ 2.6.1
  esp32async/AsyncTCP @ 3.3.2
  esp32async/ESPAsyncWebServer @ 3.7.2
  bblanchon/ArduinoJson @ 7.3.0
build_flags =
  ${env.build_flags}
  -DWEBSOCKETS_NETWORK_TYPE=NETWORK_ESP32
