# catalog_url                = https://raw.githubusercontent.com/nsabba/bose-preset-bridge/main/catalog/radios.json
# debounce_seconds           = 3      ; evenement identique ignore s'il arrive moins de 3 s apres
# watchdog                   = true   ; verifie /now_playing apres chaque Play
# watchdog_timeout           = 10     ; secondes d'attente de PLAY_STATE (poll toutes les 2 s)
# auto_reboot                = true   ; redemarre l'enceinte si la lecture reste bloquee
# auto_reboot_min_interval   = 900    ; au plus 1 redemarrage automatique par 15 min
# preset_write_method        = upnp   ; upnp | lir_direct | lir_local | none (voir probe_presets.py)
# rewrite_presets_on_startup = true   ; reecrit les presets de l'enceinte qui pointent vers le cloud
# firewall_check             = true   ; Windows : autorise l'exe sur le reseau prive au 1er lancement
