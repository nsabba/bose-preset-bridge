name: Build Windows .exe

on:
  push:
    branches: [main, master, v2]
  workflow_dispatch:   # bouton "Run workflow" manuel sur GitHub

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller pystray pillow

      - name: Tests
        run: python -m unittest discover -s tests -v

      - name: Build BosePresetBridge.exe
        run: >
          pyinstaller --onefile --noconsole --name BosePresetBridge
          --add-data "web/index.html;web"
          --add-data "catalog/radios.json;catalog"
          bridge.py

      - name: Build ProbePresets.exe (console)
        run: pyinstaller --onefile --console --name ProbePresets probe_presets.py

      - name: Smoke test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\BosePresetBridge.exe -ArgumentList "--self-check" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "BosePresetBridge --self-check failed ($($p.ExitCode))" }
          dist\ProbePresets.exe --help
          if ($LASTEXITCODE -ne 0) { throw "ProbePresets --help failed" }

      - name: Package
        shell: cmd
        run: |
          copy config.ini dist\config.example.ini
          copy install_startup.bat dist\
          copy uninstall_startup.bat dist\
          copy install_firewall.bat dist\

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BosePresetBridge-Windows
          path: |
            dist\BosePresetBridge.exe
            dist\ProbePresets.exe
            dist\config.example.ini
            dist\install_startup.bat
            dist\uninstall_startup.bat
            dist\install_firewall.bat
          retention-days: 30
